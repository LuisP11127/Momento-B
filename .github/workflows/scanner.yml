name: Scanner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      intervalo:
        description: "Temporalidad de las velas"
        type: choice
        default: "4h"
        options: ["15m", "30m", "1h", "2h", "4h", "6h", "12h", "1d", "1w"]
      min_volumen:
        description: "Volumen mínimo en 24h (en USDT)"
        default: "0"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  scan:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTERVALO: ${{ inputs.intervalo || '4h' }}
      MIN_VOLUMEN: ${{ inputs.min_volumen || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Binance puede bloquear las IP de GitHub (error 451): el escaneo no hace fallar el workflow,
      # el resultado queda en el resumen y en el informe descargable.
      - name: Escanear Binance
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reportes
          python -m momento_b -i "$INTERVALO" --min-volumen "$MIN_VOLUMEN" \
            --spot-url https://data-api.binance.vision \
            --no-abrir --html reportes/momento-b.html --json reportes/momento-b.json \
            2>&1 | tee reportes/salida.txt

      - name: Resumen
        if: always()
        shell: bash
        run: |
          {
            echo "## Momento-B · velas $INTERVALO"
            echo
            echo '```'
            cat reportes/salida.txt 2>/dev/null || echo "Sin salida"
            echo '```'
            echo
            echo "Descarga el informe con los gráficos en **Artifacts → momento-b**, al final de esta página."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo "::warning title=Escaneo incompleto::Algún mercado no se pudo escanear; revisa el resumen."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momento-b
          path: reportes/
          retention-days: 7

  # TEMPORAL: averiguar cómo distingue Binance las acciones tokenizadas de las criptomonedas.
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          import requests

          stocks = {"AMZNBUSDT", "IBMBUSDT", "ORCLBUSDT", "CRMBUSDT", "COHRBUSDT", "AAOIBUSDT", "FLNCBUSDT", "BNCBUSDT"}
          info = requests.get("https://data-api.binance.vision/api/v3/exchangeInfo", timeout=30).json()
          usdt = [s for s in info["symbols"] if s["status"] == "TRADING" and s["quoteAsset"] == "USDT"]
          st = [s for s in usdt if s["symbol"] in stocks]
          others = [s for s in usdt if s["symbol"] not in stocks]
          print("USDT trading:", len(usdt), "acciones encontradas:", len(st))
          for s in st[:2] + [s for s in others if s["symbol"] in ("TRXUSDT", "GIGGLEUSDT")]:
              print("ENTRY", json.dumps({k: v for k, v in s.items() if k != "filters"}))
              print("FILTERS", s["symbol"], json.dumps(s["filters"]))
          keys = sorted({k for s in usdt for k in s} - {"filters"})
          for k in keys:
              sv = Counter(json.dumps(s.get(k), sort_keys=True) for s in st)
              ov = Counter(json.dumps(s.get(k), sort_keys=True) for s in others)
              if set(sv) - set(ov) or len(ov) > 1:
                  print("FIELD", k, "| acciones:", dict(sv), "| resto (top 5):", ov.most_common(5))
          ft = Counter(f["filterType"] for s in st for f in s["filters"])
          fo = Counter(f["filterType"] for s in others for f in s["filters"])
          print("FILTERTYPES acciones:", dict(ft), "| resto:", dict(fo))
          # Pares que comparten exactamente los permissionSets de las acciones
          sets = {json.dumps(s.get("permissionSets"), sort_keys=True) for s in st}
          same = [s["symbol"] for s in others if json.dumps(s.get("permissionSets"), sort_keys=True) in sets]
          print("MISMOS permissionSets en el resto:", len(same), same[:80])

          for url in ["https://www.binance.com/bapi/asset/v2/public/asset-service/product/get-products?includeEtf=true",
                      "https://www.binance.com/bapi/composite/v1/public/marketing/symbol/list"]:
              try:
                  r = requests.get(url, timeout=30, headers={"User-Agent": "Mozilla/5.0"})
                  print("URL", url, r.status_code, r.text[:200].replace("\n", " "))
                  data = r.json().get("data") if r.ok else None
                  if isinstance(data, list):
                      for p in data:
                          if p.get("s") in stocks or p.get("symbol") in stocks or p.get("s") == "TRXUSDT":
                              print("PRODUCT", json.dumps(p)[:600])
              except Exception as exc:
                  print("URL", url, "ERROR", exc)
          PY
