name: Scanner

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["docs/seguimiento/**"]  # los guardados del seguimiento no cambian el código
  workflow_dispatch:
    inputs:
      mercado:
        description: "Mercado (futuros da error 451 desde los servidores de GitHub)"
        type: choice
        default: "spot"
        options: ["spot", "futures", "ambos"]
      intervalo:
        description: "Temporalidad del escaneo"
        type: choice
        default: "4h"
        options: ["15m", "30m", "1h", "2h", "4h", "6h", "8h", "12h", "1d", "1w"]
      min_volumen:
        description: "Volumen mínimo en 24h (en USDT)"
        default: "0"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      # La página guarda en el navegador la clave de GitHub del seguimiento: la librería de gráficos
      # se carga con una huella (SRI) y aquí se comprueba que coincide con el archivo del CDN.
      - name: Comprobar la huella de la librería de gráficos
        run: |
          python - <<'PY'
          import base64, hashlib, re, urllib.request
          html = open("momento_b/report_template.html", encoding="utf-8").read()
          src, integrity = re.search(r'<script src="(https://[^"]+)" integrity="([^"]+)"', html).groups()
          data = urllib.request.urlopen(src, timeout=60).read()
          digest = "sha384-" + base64.b64encode(hashlib.sha384(data).digest()).decode()
          print(src, digest)
          assert digest == integrity, f"la huella no coincide: {digest} != {integrity}"
          PY

  # La web en Chromium, con Binance y GitHub simulados (tests/web).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pruebas-web
          path: |
            tests/web/playwright-report/
            tests/web/test-results/
          retention-days: 7

  scan:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MERCADO: ${{ inputs.mercado || 'spot' }}
      INTERVALO: ${{ inputs.intervalo || '4h' }}
      MIN_VOLUMEN: ${{ inputs.min_volumen || '0' }}
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      # Binance bloquea las IP de servidores en la nube (error 451 en futuros): el escaneo no hace
      # fallar el workflow, el resultado queda en el resumen y en el informe descargable.
      - name: Escanear Binance
        id: scan
        continue-on-error: true
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          os.makedirs("reportes", exist_ok=True)
          cmd = [sys.executable, "-m", "momento_b", "-m", os.environ["MERCADO"], "-i", os.environ["INTERVALO"],
                 "--min-volumen", os.environ["MIN_VOLUMEN"], "--spot-url", "https://data-api.binance.vision",
                 "--no-abrir", "--html", "reportes/momento-b.html", "--json", "reportes/momento-b.json"]
          proc = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding="utf-8")
          print(proc.stdout)
          pathlib.Path("reportes/salida.txt").write_text(proc.stdout, encoding="utf-8")
          sys.exit(proc.returncode)

      - name: Resumen
        if: always()
        shell: python
        run: |
          import os, pathlib
          salida = pathlib.Path("reportes/salida.txt")
          text = salida.read_text(encoding="utf-8").rstrip() if salida.exists() else "Sin salida"
          lines = [f"## Momento-B · {os.environ['MERCADO']} · velas {os.environ['INTERVALO']}", "", "```", text, "```", "",
                   "Descarga el informe con los gráficos en **Artifacts → momento-b**, al final de esta página."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          if "${{ steps.scan.outcome }}" != "success":
              print("::warning title=Escaneo incompleto::Algún mercado no se pudo escanear; revisa el resumen.")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momento-b
          path: reportes/
          retention-days: 7
